<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>revapi · human check</title>
<style>
 html,body{margin:0;background:#1c1916;color:#fff7f0;font:15px system-ui,sans-serif}
 header{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #3a332d}
 .pill{background:#ff3d8b;color:#1c1916;font-weight:700;border-radius:3px;padding:2px 8px}
 #st{color:#e8b86d}#st.ok{color:#7ec99a}
 #wrap{position:relative;overflow:auto;max-height:72vh;-webkit-overflow-scrolling:touch}
 #inner{position:relative;width:100%}
 #v{width:100%;display:block;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:manipulation}
 #dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #ff3d8b;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .5s}
 footer{padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid #3a332d}
 button,input{font:inherit;border-radius:4px;border:1px solid #3a332d;background:#2a2521;color:#fff7f0;padding:7px 10px}
 input{flex:1;min-width:120px}
 #done{background:#7ec99a;color:#1c1916;font-weight:700;border:0}
 small{display:block;padding:0 12px 14px;color:#9b8f84}
</style></head><body>
<header><span class="pill">revapi</span><b>__LABEL__</b><span id="st">waiting for you…</span></header>
<div id="wrap"><div id="inner"><img id="v" alt="loading the browser view…"><div id="dot"></div></div></div>
<footer>
 <button data-s="-600">▲</button><button data-s="600">▼</button>
 <input id="tx" placeholder="type into the focused field"><button id="send">type</button>
 <button data-k="Enter">⏎</button><button data-k="Backspace">⌫</button><button data-k="Tab">⇥</button>
 <button id="zoom">zoom 1×</button>
 <button id="done">I'm done</button>
</footer>
<small>This is revapi's own browser, mirrored live. Tap where you would tap on the page. revapi carries on by itself once the check is passed.</small>
<script>
const K = new URLSearchParams(location.search).get('k') || '';
const v = document.getElementById('v'), st = document.getElementById('st'), dot = document.getElementById('dot');
let meta = {w: 1280, h: 900}, n = 0, finished = false, zoom = 1, aimed = false;
const wrap = document.getElementById('wrap'), inner = document.getElementById('inner'), zb = document.getElementById('zoom');
function setZoom(z, cx, cy) {
  zoom = Math.max(1, Math.min(4, z)); inner.style.width = (zoom * 100) + '%'; zb.textContent = 'zoom ' + (Math.round(zoom * 10) / 10) + '×';
  if (cx !== undefined) { const s = wrap.clientWidth * zoom / meta.w; wrap.scrollLeft = cx * s - wrap.clientWidth / 2; wrap.scrollTop = cy * s - wrap.clientHeight / 2; }
}
zb.onclick = () => setZoom(zoom >= 3 ? 1 : Math.floor(zoom) + 1);
const post = (path, body) => fetch(path + '?k=' + K, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body || {})}).then(r => r.json()).catch(() => ({}));
function frame() {
  if (finished) return;
  const img = new Image();
  img.onload = () => { v.src = img.src; setTimeout(frame, 350); };
  img.onerror = () => setTimeout(frame, 1000);
  img.src = '/frame.jpg?k=' + K + '&n=' + (n++);
}
async function poll() {
  try {
    const s = await (await fetch('/state?k=' + K)).json();
    meta = s;
    if (!aimed && s.focus && s.focus.w > 0) {  // zoom onto the check so it is easy to tap on a phone
      aimed = true; const f = s.focus;
      setTimeout(() => setZoom(0.8 * s.w / Math.max(f.w, 120), f.x + f.w / 2, f.y + f.h / 2), 300);
    }
    if (s.finished) { finished = true; st.textContent = s.message || 'done — back to revapi'; st.className = 'ok'; return; }
    st.textContent = s.challenge ? 'check still showing · ' + s.left + ' left' : 'page looks clear…';
  } catch (e) { st.textContent = 'revapi is not answering'; }
  setTimeout(poll, 1000);
}
v.addEventListener('click', (e) => {
  const r = v.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  dot.style.left = (fx * 100) + '%'; dot.style.top = (fy * v.offsetHeight) + 'px';
  dot.style.opacity = 1; setTimeout(() => dot.style.opacity = 0, 600);
  post('/tap', {fx, fy});
});
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => post('/scroll', {dy: +b.dataset.s}));
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => post('/key', {key: b.dataset.k}));
document.getElementById('send').onclick = () => { const t = document.getElementById('tx'); if (t.value) post('/type', {text: t.value}); t.value = ''; };
document.getElementById('done').onclick = () => post('/done');
frame(); poll();
</script></body></html>
